<style>
  :root{
    --ink:#15181C;
    --ink2:#525A63;
    --ink3:#8A9299;
    --paper:#F4F3EF;
    --card:#FFFFFF;
    --rule:#E1DDD5;
    --nav:#1E2C3A;
    --nav2:#2B3E51;
    --bon:#2F7A57;
    --moyen:#B0761A;
    --mauvais:#A93A29;
    --focus:#2E6FB7;
    --radius:10px;
    --pad:16px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ui);
    background:var(--paper);
    color:var(--ink);
    font-size:16px;
    line-height:1.45;
    padding-bottom:96px;
  }
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:var(--nav);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 0;
  }
  .hrow{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
  .htitle{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    font-family:var(--mono);color:#9FB3C6;
  }
  .haddr{
    font-size:17px;font-weight:600;margin:2px 0 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .haddr.empty{color:#7E93A6;font-weight:400}
  .badge{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;white-space:nowrap;
  }
  .badge.entree{background:#37506A;color:#CFE1F2}
  .badge.sortie{background:#6A4A20;color:#F5DCB4}
  .saved{
    font-family:var(--mono);font-size:11px;color:#7E93A6;height:16px;
    margin:4px 0 8px;
  }
  nav{
    display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
    margin:0 calc(var(--pad) * -1);padding:0 var(--pad);
  }
  nav::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:10px 13px 11px;color:#93A8BB;
    font-size:14px;font-weight:500;border-bottom:3px solid transparent;
    display:flex;align-items:center;gap:7px;
  }
  .tab[aria-selected="true"]{color:#fff;border-bottom-color:#E8B450}
  .dot{width:7px;height:7px;border-radius:50%;background:#4A6076;flex:0 0 auto}
  .tab[data-done="1"] .dot{background:#5FBF8E}

  /* ---------- layout ---------- */
  main{padding:var(--pad);max-width:760px;margin:0 auto}
  .panel{display:none}
  .panel.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.panel.on{animation:none}}

  h2{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    font-family:var(--mono);color:var(--ink3);
    margin:0 0 10px;font-weight:600;
  }
  .card{
    background:var(--card);border:1px solid var(--rule);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;
  }
  label.f{display:block;margin-bottom:12px}
  label.f:last-child{margin-bottom:0}
  .lab{
    display:block;font-size:12px;font-weight:600;color:var(--ink2);
    margin-bottom:5px;letter-spacing:.01em;
  }
  input[type=text],input[type=date],input[type=number],textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--rule);
    border-radius:8px;background:#FCFCFB;
  }
  input[type=number],.mono{font-family:var(--mono)}
  textarea{resize:vertical;min-height:64px}
  input:focus,textarea:focus,select:focus{
    outline:2px solid var(--focus);outline-offset:1px;border-color:transparent;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:420px){.grid2{grid-template-columns:1fr}}

  /* ---------- element row : the signature control ---------- */
  .el{border-top:1px solid var(--rule);padding:13px 0}
  .el:first-of-type{border-top:none;padding-top:2px}
  .elhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .elname{font-weight:600;font-size:15px}
  .seg{display:flex;gap:5px;margin-top:9px}
  .seg button{
    flex:1;padding:11px 4px 9px;border:1.5px solid var(--rule);
    border-radius:9px;background:#FAFAF8;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:background .12s,border-color .12s,color .12s;
  }
  .seg button .k{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1}
  .seg button .w{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
  .seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
  .seg button[aria-pressed="true"] .w{color:rgba(255,255,255,.82)}
  .seg button[data-v="B"][aria-pressed="true"]{background:var(--bon)}
  .seg button[data-v="M"][aria-pressed="true"]{background:var(--moyen)}
  .seg button[data-v="N"][aria-pressed="true"]{background:var(--mauvais)}
  .seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .el textarea{margin-top:9px;min-height:44px}
  .ref{
    margin-top:8px;padding:8px 10px;border-radius:7px;
    background:#F3F1EC;border-left:3px solid #C3B490;
    font-size:13px;color:var(--ink2);
  }
  .ref b{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink)}

  /* ---------- photos ---------- */
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .ph{
    position:relative;width:76px;height:76px;border-radius:8px;
    overflow:hidden;border:1px solid var(--rule);background:#EEE;
  }
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .num{
    position:absolute;left:0;top:0;background:rgba(21,24,28,.78);color:#fff;
    font-family:var(--mono);font-size:10px;padding:1px 5px;border-bottom-right-radius:6px;
  }
  .ph .del{
    position:absolute;right:2px;bottom:2px;width:22px;height:22px;
    background:rgba(21,24,28,.78);color:#fff;border-radius:50%;
    font-size:14px;line-height:22px;text-align:center;
  }
  .addph{
    width:76px;height:76px;border:1.5px dashed var(--rule);border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:var(--ink3);background:#FAFAF8;
  }
  .addph span{font-size:11px}
  .addph .plus{font-size:20px;line-height:1}
  .ph.refph{opacity:.72;border-style:dashed}

  /* ---------- signature ---------- */
  .sigbox{
    border:1px solid var(--rule);border-radius:9px;background:#FCFCFB;
    height:150px;position:relative;overflow:hidden;
  }
  .sigbox canvas{width:100%;height:100%;display:block;touch-action:none}
  .sigbox .hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink3);font-size:13px;pointer-events:none;
  }
  .sigbox.has .hint{display:none}
  .sigline{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:7px;
  }
  .link{color:var(--focus);font-size:13.5px;font-weight:500;padding:4px 0}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:13px 18px;border-radius:9px;font-weight:600;font-size:15px;
    background:var(--nav);color:#fff;width:100%;
  }
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--rule)}
  .btn.warn{background:#6A4A20}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .btnrow{display:flex;gap:9px}
  .btnrow .btn{flex:1}

  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(244,243,239,.94);backdrop-filter:blur(8px);
    border-top:1px solid var(--rule);
    padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 10px);
  }
  footer .inner{max-width:760px;margin:0 auto;display:flex;gap:9px}
  footer .btn{flex:1}

  .note{font-size:13px;color:var(--ink2);margin:0 0 12px}
  .warnbox{
    background:#FBF3E2;border:1px solid #E5D2A8;border-radius:9px;
    padding:12px;font-size:13.5px;color:#6A4A20;margin-bottom:12px;
  }
  #toast{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:#fff;padding:11px 17px;border-radius:9px;
    font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;
    max-width:88vw;text-align:center;
  }
  #toast.on{opacity:1;transform:translateX(-50%)}
  .hidden{display:none !important}
  #ovl{
    position:fixed;inset:0;z-index:80;background:#fff;display:none;
    flex-direction:column;
  }
  #ovl.on{display:flex}
  #ovlbar{
    background:var(--nav);color:#fff;display:flex;gap:9px;align-items:center;
    padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
  }
  #ovlbar .t{
    flex:1;font-family:var(--mono);font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:#9FB3C6;
  }
  #ovlbar button{
    padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;
  }
  #ovlclose{background:#3A4E63;color:#fff}
  #ovlprint{background:#E8B450;color:#1E2C3A}
  #ovl iframe{flex:1;width:100%;border:none;background:#fff}
</style>

<script>
(function(){
"use strict";

/* ============ modèle ============ */
const ROOMS = [
  { id:"cuisine", name:"Cuisine", els:[
    "Sols","Murs / plafond","Fenêtre / volet","Porte",
    "Électricité / prises","Chauffage",
    "Plan de travail & rangements","Évier / robinetterie","Appareils encastrés"
  ]},
  { id:"salon", name:"Espace salon", els:[
    "Sols","Murs / plafond","Fenêtres / volets","Porte",
    "Électricité / prises","Chauffage","Rangements / placards"
  ]},
  { id:"chambre", name:"Espace chambre", els:[
    "Sols","Murs / plafond","Fenêtres / volets","Porte",
    "Électricité / prises","Chauffage","Rangements / placards"
  ]},
  { id:"sdb", name:"Salle de bain", els:[
    "Sols","Murs / plafond","Fenêtre / ventilation","Porte",
    "Électricité / prises","Chauffage",
    "Douche / baignoire","Lavabo / robinetterie","WC"
  ]}
];
const TABS = [
  {id:"infos",    label:"Infos"},
  {id:"compteurs",label:"Compteurs"},
  {id:"cuisine",  label:"Cuisine"},
  {id:"salon",    label:"Salon"},
  {id:"chambre",  label:"Chambre"},
  {id:"sdb",      label:"Salle de bain"},
  {id:"fin",      label:"Signatures"}
];
const VALS = [["B","Bon"],["M","Moyen"],["N","Mauvais"]];

function blank(){
  const rooms = {};
  ROOMS.forEach(r=>{
    rooms[r.id] = {};
    r.els.forEach(e=>{ rooms[r.id][e] = {etat:"",obs:""}; });
  });
  const photos = {}; ROOMS.forEach(r=>photos[r.id]=[]);
  return {
    v:1,
    type:"entree",
    meta:{date:today(),adresse:"",bailleur:"",locataire:"",cles:"",badges:""},
    compteurs:{elec:"",elecNum:"",eauF:"",eauC:"",gaz:""},
    rooms, photos,
    obsGen:"",
    sig:{bailleur:"",locataire:"",lieu:"",dateSig:today()},
    ref:null
  };
}
function normalize(data){
  // fusionne un fichier importe dans la structure courante :
  // tolere les champs manquants, les pieces ajoutees ou renommees
  const base=blank();
  if(!data||typeof data!=="object") return base;
  base.type = data.type==="sortie" ? "sortie" : "entree";
  Object.assign(base.meta, data.meta||{});
  Object.assign(base.compteurs, data.compteurs||{});
  Object.assign(base.sig, data.sig||{});
  base.obsGen = typeof data.obsGen==="string" ? data.obsGen : "";
  ROOMS.forEach(r=>{
    const src=(data.rooms&&data.rooms[r.id])||{};
    r.els.forEach(e=>{
      const v=src[e]||{};
      base.rooms[r.id][e]={etat:v.etat||"",obs:v.obs||""};
    });
    const ph=(data.photos&&data.photos[r.id])||[];
    base.photos[r.id]=Array.isArray(ph)?ph.filter(x=>x&&x.data):[];
  });
  base.ref = data.ref || null;
  return base;
}

function today(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function frDate(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y;
}

let S = blank();
let current = "infos";

/* ============ stockage (brouillon) ============ */
const backend = (function(){
  // 1) stockage fourni par l'environnement Claude
  if (typeof window!=="undefined" && window.storage && window.storage.set){
    return {
      name:"host",
      async set(k,v){ await window.storage.set(k,v); },
      async get(k){ try{ const r=await window.storage.get(k); return r&&r.value?r.value:null; }catch(e){ return null; } },
      async del(k){ try{ await window.storage.delete(k); }catch(e){} }
    };
  }
  // 2) IndexedDB : gros volumes, ideal pour les photos
  if (typeof indexedDB!=="undefined"){
    let dbp=null;
    const open=()=> dbp || (dbp=new Promise((res,rej)=>{
      const r=indexedDB.open("edl-store",1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore("kv"); };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }));
    const tx=(mode,fn)=> open().then(db=>new Promise((res,rej)=>{
      const t=db.transaction("kv",mode);
      const st=t.objectStore("kv");
      let out;
      try{ out=fn(st); }catch(e){ rej(e); return; }
      t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);
      t.onerror=()=>rej(t.error);
      t.onabort=()=>rej(t.error);
    }));
    return {
      name:"indexeddb",
      set:(k,v)=>tx("readwrite",st=>st.put(v,k)),
      get:(k)=>tx("readonly",st=>st.get(k)).then(v=>v===undefined?null:v).catch(()=>null),
      del:(k)=>tx("readwrite",st=>st.delete(k)).catch(()=>{})
    };
  }
  // 3) dernier recours
  return {
    name:"memoire",
    _m:{},
    async set(k,v){ this._m[k]=v; },
    async get(k){ return this._m[k]||null; },
    async del(k){ delete this._m[k]; }
  };
})();

const store = {
  async saveData(){
    const {photos, ...rest} = S;
    try{ await backend.set("edl:draft:data", JSON.stringify(rest)); }
    catch(e){ console.warn("save data",e); }
  },
  async savePhotos(roomId){
    try{ await backend.set("edl:draft:ph:"+roomId, JSON.stringify(S.photos[roomId]||[])); }
    catch(e){ toast("Stockage plein : photo non sauvegardée"); }
  },
  async saveAll(){
    await this.saveData();
    for(const r of ROOMS) await this.savePhotos(r.id);
  },
  async load(){
    let data=null;
    try{ const v=await backend.get("edl:draft:data"); if(v) data=JSON.parse(v); }
    catch(e){ return false; }
    if(!data) return false;
    const photos={};
    for(const r of ROOMS){
      photos[r.id]=[];
      try{ const v=await backend.get("edl:draft:ph:"+r.id); if(v) photos[r.id]=JSON.parse(v); }
      catch(e){}
    }
    S=normalize(data); S.photos=photos;
    return true;
  },
  async clear(){
    await backend.del("edl:draft:data");
    for(const r of ROOMS) await backend.del("edl:draft:ph:"+r.id);
  }
};

  if(seg){

let pendingRoom=null;
const fileIn=document.getElementById("fileIn");
const photoIn=document.createElement("input");
photoIn.type="file"; photoIn.accept="image/*"; photoIn.multiple=true; photoIn.className="hidden";
document.body.appendChild(photoIn);

photoIn.addEventListener("change", async ()=>{
  const files=[...photoIn.files]; if(!files.length||!pendingRoom) return;
  toast(files.length>1?"Compression des photos…":"Compression de la photo…");
  for(const f of files){
    try{
      const data=await compress(f);
      S.photos[pendingRoom].push({data, ts:Date.now()});
    }catch(err){ console.warn(err); toast("Photo illisible, ignorée"); }
  }
  renderPhotos(pendingRoom);
  await store.savePhotos(pendingRoom);
  toast(files.length>1?"Photos ajoutées":"Photo ajoutée");
});

function compress(file, max=1100, q=0.62){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      const sc=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement("canvas");
      cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};
    img.src=url;
  });
}

/* ============ signature ============ */
function setupSig(who){
  const box=document.getElementById("sb-"+who);
  if(!box) return;
  const cv=box.querySelector("canvas");
  const rect=box.getBoundingClientRect();
  // panneau encore masque : on repasse au prochain cycle
  if(rect.width<2||rect.height<2){
    requestAnimationFrame(()=>setupSig(who));
    return;
  }
  if(cv.dataset.ready==="1") return;
  cv.dataset.ready="1";
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(rect.width*dpr));
  cv.height=Math.max(1,Math.round(rect.height*dpr));
  const ctx=cv.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#15181C";

  if(S.sig[who]){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);
    img.src=S.sig[who];
  }
  let drawing=false;
  const pos=ev=>{
    const r=cv.getBoundingClientRect();
    return {x:ev.clientX-r.left, y:ev.clientY-r.top};
  };
  cv.addEventListener("pointerdown",ev=>{
    drawing=true; cv.setPointerCapture(ev.pointerId);
    const p=pos(ev); ctx.beginPath(); ctx.moveTo(p.x,p.y);
    box.classList.add("has");
  });
  cv.addEventListener("pointermove",ev=>{
    if(!drawing) return;
    const p=pos(ev); ctx.lineTo(p.x,p.y); ctx.stroke();
  });
  const end=()=>{
    if(!drawing) return; drawing=false;
    S.sig[who]=cv.toDataURL("image/png");
    renderTabs(); touchSave();
  };
  cv.addEventListener("pointerup",end);
  cv.addEventListener("pointercancel",end);
  cv.addEventListener("pointerleave",end);
}

<p style="font-size:13px">Fait à ${esc(S.sig.lieu||"—")}, le ${esc(frDate(S.sig.dateSig))}.
Les photographies annexées font partie intégrante du présent état des lieux.</p>
<div class="sigs">${sig("bailleur","Le bailleur / mandataire")}${sig("locataire","Le locataire")}</div>

<div class="foot">Document établi contradictoirement — article 3-2 de la loi n°89-462 du 6 juillet 1989.</div>
<script type="application/json" id="edl-data">${JSON.stringify(S).replace(/</g,"\\u003c")}<\/script>`;
}

function showReport(thenPrint){
  if(!S.meta.adresse){ toast("Renseigne l'adresse d'abord"); current="infos"; renderAll(); return; }
  const ovl=document.getElementById("ovl");
  const fr=document.getElementById("ovlframe");
  ovl.classList.add("on");
  document.body.style.overflow="hidden";
  const doc=fr.contentDocument||fr.contentWindow.document;
  doc.open(); doc.write(reportHTML()); doc.close();
  if(thenPrint){
    setTimeout(()=>{
      try{ fr.contentWindow.focus(); fr.contentWindow.print(); }
      catch(e){ toast("Utilise le bouton PDF en haut de l'aperçu"); }
    },900);
    toast("Choisis « Enregistrer dans Fichiers »");
  }
}
function hideReport(){
  const ovl=document.getElementById("ovl");
  ovl.classList.remove("on");
  document.body.style.overflow="";
  const fr=document.getElementById("ovlframe");
  const doc=fr.contentDocument||fr.contentWindow.document;
  doc.open(); doc.write(""); doc.close();
}
function exportPDF(){ showReport(true); }
function viewReport(){ showReport(false); }

document.getElementById("ovlclose").onclick=hideReport;
document.getElementById("ovlprint").onclick=()=>{
  const fr=document.getElementById("ovlframe");
  try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ toast("Impression indisponible"); }
};

function exportFile(){
  if(!S.meta.adresse){ toast("Renseigne l'adresse avant d'exporter"); current="infos"; renderAll(); return; }
  const html=reportHTML();
  const slug=(S.meta.adresse||"logement").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const name=`EDL-${S.type}-${slug}-${S.meta.date}.html`;
  const blob=new Blob([html],{type:"text/html"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  toast("Fichier exporté");
}

/* ============ import ============ */
document.getElementById("btnImport").onclick=()=>{ fileIn.value=""; fileIn.click(); };
document.getElementById("btnExport").onclick=exportPDF;

fileIn.addEventListener("change",async()=>{
  const f=fileIn.files[0]; if(!f) return;
  let txt;
  try{ txt=await f.text(); }catch(e){ toast("Fichier illisible"); return; }
  const m=txt.match(/<script type="application\/json" id="edl-data">([\s\S]*?)<\/script>/);
  if(!m){ toast("Ce fichier n'est pas un état des lieux exporté"); return; }
  let data;
  try{ data=JSON.parse(m[1].replace(/\\u003c/g,"<")); }
  catch(e){ toast("Fichier endommagé"); return; }

  const wasEntree = data.type!=="sortie";
  if(wasEntree && confirm("État des lieux d'entrée chargé.\n\nCréer l'état des lieux de sortie à partir de celui-ci ?")){
    const src=normalize(data);
    const ref={rooms:src.rooms, photos:src.photos};
    S=blank();
    S.type="sortie";
    S.meta=Object.assign({},data.meta,{date:today()});
    S.ref=ref;
    S.sig.dateSig=today();
    toast("Sortie créée — les valeurs d'entrée sont rappelées");
  }else{
    S=normalize(data);
    toast("État des lieux chargé");
  }
  current="infos"; renderAll();
  await store.saveData();
  for(const r of ROOMS) await store.savePhotos(r.id);
});

/* ============ init ============ */
(async function init(){
  renderAll();
  const had=await store.load();
  if(had){ renderAll(); markSaved("Brouillon restauré"); }
})();

// iOS ferme les apps en arriere-plan sans prevenir : on enregistre tout de suite
function flush(){ clearTimeout(saveTimer); store.saveData(); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) flush(); });
window.addEventListener("pagehide", flush);
window.addEventListener("blur", flush);

window.addEventListener("resize",()=>{
  if(current==="fin"){ setupSig("bailleur"); setupSig("locataire"); }
});
})();
</script>
